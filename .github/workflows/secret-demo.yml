name: Secret demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
    steps:
      - name: Vérifier et afficher le secret
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "Le secret DEMO_TOKEN est vide ou absent"
            exit 1
          fi
          echo "Longueur du secret : ${#DEMO_TOKEN}"
          echo "Valeur du secret : $DEMO_TOKEN"

      - name: Afficher la variable APP_ENV
        run: echo "APP_ENV = ${{ vars.APP_ENV }}"
