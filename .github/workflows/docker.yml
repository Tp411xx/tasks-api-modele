name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: pytest --cov=app --cov-fail-under=80

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Calculer la version et le nom de l'image
        id: meta_calc
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v4

      - name: Se connecter à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Générer les tags et labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.meta_calc.outputs.owner }}/tasks-api
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta_calc.outputs.version }}
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - name: Calculer le nom de l'image
        id: meta_calc
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Se connecter à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lancer l'image du commit
        run: |
          docker run -d --name app -p 8000:8000 \
            ghcr.io/${{ steps.meta_calc.outputs.owner }}/tasks-api:sha-${GITHUB_SHA::7}

      - name: Test de fumée
        run: |
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "Service en bonne santé"
              curl -fsS http://localhost:8000/version
              echo
              exit 0
            fi
            echo "Attente du démarrage ($i/10)..."
            sleep 3
          done
          echo "Le service ne répond pas"
          docker logs app
          exit 1
      - name: Arrêter le conteneur
        if: always()
        run: docker rm -f app || true

  deploy-production:
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Calculer le nom de l'image
        id: meta_calc
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Se connecter à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lancer l'image de la release
        run: |
          docker run -d --name app -p 8000:8000 \
            ghcr.io/${{ steps.meta_calc.outputs.owner }}/tasks-api:${GITHUB_REF_NAME#v}

      - name: Test de fumée
        run: |
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "Service en bonne santé"
              curl -fsS
  update-config:
    needs: deploy-production # TROU 1 : ce job démarre après quel job ?
    if: startsWith(github.ref, 'refs/tags/v') # TROU 2 : uniquement sur un tag : regardez la ligne `if` de deploy-production ; si elle est écrite autrement, recopiez-la telle quelle à la place de cette ligne
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ github.ref_name }} # le nom du tag, par exemple v0.2.0
    steps:
      - name: Récupérer le dépôt applicatif
        uses: actions/checkout@v6 # même version que vos autres jobs

      - name: Récupérer le dépôt de configuration
        uses: actions/checkout@v6
        with:
          repository: https://github.com/Tp411xx/tasks-config # TROU 3 : votre compte GitHub (minuscules)
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: "tasks-config" # TROU 4 : le dossier attendu par la commande suivante

      - name: Mettre à jour la version de l'image
        run: bash scripts/set-image-tag.sh config/k8s/deployment.yaml "${VERSION#v}"

      - name: Commiter et pousser dans tasks-config
        run: |
          cd config
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .               # TROU 5 : le fichier modifié, chemin depuis la racine de tasks-config
          git commit -m "Déploiement de tasks-api ${VERSION#v}"
          git push
